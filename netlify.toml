[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# --- Односторінковий лендинг: старі URL (вже в індексі Google) -> якорі на головній ---
# Файли старих сторінок видалено (2026-10-21); force = true лишається підстраховкою —
# редірект спрацює, навіть якщо за цим шляхом колись знову з'явиться файл.
[[redirects]]
  from = "/posluhy/"
  to = "/#posluhy"
  status = 301
  force = true

[[redirects]]
  from = "/posluhy/*"
  to = "/#posluhy"
  status = 301
  force = true

[[redirects]]
  from = "/pro-mene/"
  to = "/#pro-mene"
  status = 301
  force = true

[[redirects]]
  from = "/onlayn-konsultatsii/"
  to = "/#formaty"
  status = 301
  force = true

[[redirects]]
  from = "/dlya-ukraintsiv-za-kordonom/"
  to = "/#formaty"
  status = 301
  force = true

[[redirects]]
  from = "/vidguky/"
  to = "/#vidguky"
  status = 301
  force = true

# --- Робочі файли проєкту не віддаємо публічно (publish = "." викладає всю папку) ---
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/content-template.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/seo-analiz.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify autorisation.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify%20autorisation.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/env variables"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/env%20variables"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
